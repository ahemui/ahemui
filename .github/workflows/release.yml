name: Release

# Push a tag like v0.4.1 after `npm run set-version 0.4.1`, a release build and a commit (see RELEASING.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub release and its extension zip
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AHEMUI_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted publishing (OIDC, no npm token) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - name: Tag matches the versions in the repo
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in packages/vite/package.json packages/extension/manifest.json packages/claude-plugin/.claude-plugin/plugin.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then echo "::error file=$f::version $v does not match tag $tag"; exit 1; fi
          done
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes @anthropic-ai/claude-code plugin validate packages/claude-plugin
      - name: Publish ahemui to npm (with provenance)
        # Skipped when this version is already on npm (a first release published by hand, or a re-run), so the
        # GitHub release and the extension zip still get made.
        run: |
          v=$(node -p "require('./packages/vite/package.json').version")
          if npm view "ahemui@$v" version >/dev/null 2>&1; then
            echo "ahemui@$v is already on npm; skipping publish"
          else
            npm publish ./packages/vite --provenance --access public
          fi
      - name: Zip the extension (attached to the GitHub release; load it unpacked)
        run: cd packages/extension/dist && zip -r "../../../ahemui-extension-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: ahemui-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
